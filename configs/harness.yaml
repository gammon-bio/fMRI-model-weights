# Phase 2 evaluation harness (docs/phase2_harness_spec.md v2, docs/harness_usage.md).
# Data and model settings come from base_config / finetune_config unchanged (generator-frozen-v2).
base_config: configs/default.yaml
finetune_config: configs/finetune.yaml

# Recorded in sealed/meta.json and score.json for every episode prepared with this config.
# Label recorded in each episode meta.json. Main study 2026-11-04 ran with the stale pilot label; see
# results/phase2_main/REPORT.md (protocol notes).
isolation_label: "orphan-branch hand-off (p2ho/<episode>, agent-visible files only); separate cloud sessions; remote has other branches; command log audited blind"

secrets:
  key_path: ~/.fmritest_harness/key      # 32 random bytes, mode 600, created if absent; never in the repo
seeds:
  lo: 10000                              # episode seed = lo + HMAC-SHA256(key, episode_id) mod (hi - lo)
  hi: 2147483648                         # 2**31
  forbidden: [0, 1, 2, 3, 4, 100, 101, 102, 103]   # Phase 1 seeds and power-calibration seeds

# Condition overrides applied to base_config. confound_off for false-positive episodes: only the
# confound strength is zeroed. The base config's own confound_off also disables the diagnosis, which
# would leave nothing to fine-tune or score (see docs/decisions/0001-phase2-harness.md, D1).
conditions:
  confound_on: {}
  confound_off:
    data.confound.strength: 0.0

oracle:
  max_subjects_per_call: 64
  # Raw-input leaks. hook_embed is affine in the input; blocks.0.hook_resid_pre is the same tensor
  # (byte-identical). prepare also runs fmritest/harness/leakcheck.py on every candidate hook and
  # refuses any whose held-out affine R^2 (input -> activation or activation -> input) exceeds the threshold.
  refused_hooks: [hook_embed, blocks.0.hook_resid_pre]
  leak_r2_threshold: 0.999

score:
  primary_metric: test_balanced_auc      # recorded in score.json; the pre-registration fixes the primary
  n_null: 200                            # matched random-edit draws (and variance-subspace draws)
  variance_null_k: 8                     # top-k data-variance PCs per tensor axis for the second null
  variance_n_subjects: 60                # train subjects whose activations define that subspace
  site_subspace_k: 3                     # top-k PCs of activation(X) - activation(X - confound)
  rank_rtol: 1.0e-5                      # numerical rank: singular values > rtol * s_max
  offtarget_max_drop: 0.05               # masked-query network readout may drop by at most this

comparators:
  probe_C: 0.1                           # = configs/default.yaml eval.diag_probe_C (Phase 1 post-hoc fixes)
  best_of_n:
    subjects_per_eval: 32                # site x label stratified subset of the agent pool
    rel_norm_range: [0.05, 1.0]          # ||delta||_F / ||W||_F, log-uniform
    tensors: [head.weight, "blocks.{last}.mlp.W_out.weight"]

exclusion:
  fix_min_headroom_val_balanced: 0.15    # reweight minus vanilla bacc on val_balanced (spec v2 §0)
  read_min_gap_test_balanced: 0.10       # |vanilla - reweight| bacc on test_balanced (spec §5)

# --fast: tests only. Recorded in sealed/meta.json; a fast episode is never a study episode.
fast:
  train_steps: 60
  finetune_steps: 60
  n_null: 40
  variance_n_subjects: 20
